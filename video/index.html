    <script>
      (function () {
        const root = document.getElementById("root");
        const GEO = {
          portrait: { fw: 1080, fh: 1920, card: { x: 90, y: 760, w: 900, h: 600 }, tile: { cx: 540, cy: 900, s: 240 }, price: { cx: 540, cy: 900 } },
          landscape: { fw: 1920, fh: 1080, card: { x: 860, y: 220, w: 940, h: 627 }, tile: { cx: 1330, cy: 430, s: 220 }, price: { cx: 960, cy: 540 } },
        }[root.dataset.format === "landscape" ? "landscape" : "portrait"];
        const C = GEO.card;
        const cardCX = C.x + C.w / 2;
        const cardCY = C.y + C.h / 2;
        const cardS = Math.max(GEO.fw / C.w, GEO.fh / C.h) * 1.03; // covers the frame, float never shows an edge
        const T = GEO.tile;
        const tileR = (T.s * 112) / 512; // logo.svg corner radius
        const tl0 = T.cx - T.s / 2 - C.x;
        const tt0 = T.cy - T.s / 2 - C.y;
        const TILE_WINDOW = `inset(${tt0}px ${C.w - tl0 - T.s}px ${C.h - tt0 - T.s}px ${tl0}px round ${tileR}px)`;
        const FULL_WINDOW = "inset(0px 0px 0px 0px round 32px)";

        // hook variant, chosen at render time with --variables '{"hook":"B"}'
        const HOOKS = {
          A: ["This is your Airbnb photo.", "Now watch."],
          B: ["Your listing photos", "are lying still."],
          C: ["No photoshoot.", "Just your photos."],
        };
        const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
        const hook = HOOKS[vars.hook] ? vars.hook : "A";
        document.querySelector("#hookL1 > span").textContent = HOOKS[hook][0];
        document.querySelector("#hookL2 > span").textContent = HOOKS[hook][1];

        const tl = gsap.timeline({ paused: true });
        const ft = (target, from, to, pos) => tl.fromTo(target, from, Object.assign({ immediateRender: false }, to), pos);
        const cut = (target, from, to, pos) => ft(target, from, Object.assign({ duration: 0 }, to), pos);

        // frame-0 state = the state the loop morph settles into. Set outside the timeline (a zero-length
        // set at 0 never renders at frame 0); each value is also the from-state of its first tween, so
        // seeking backwards restores it.
        gsap.set("#bloom", { x: cardCX, y: cardCY, opacity: 1 });
        gsap.set("#hookL2 > span", { yPercent: 110, opacity: 0 });

        // ambient, periodic over 24 s (16 half-cycles of 1.5 s; s6-logo.html uses the same curve)
        ft("#cardFloat", { y: 0 }, { y: -8, duration: 1.5, ease: "sine.inOut", repeat: 15, yoyo: true }, 0);
        ft("#bloomCore", { scale: 1 }, { scale: 1.1, duration: 3, ease: "sine.inOut", repeat: 7, yoyo: true }, 0);

        // 1 · HOOK (0 – 1.5): line 2 lands on beat 2, everything clears before the camera moves
        ft("#hookL2 > span", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 0.5);
        ft("#hook .ln > span", { y: 0, opacity: 1 }, { y: -70, opacity: 0, duration: 0.28, ease: "power3.in", stagger: 0.04 }, 1.2);
        ft("#pager", { opacity: 1, y: 0 }, { opacity: 0, y: 12, duration: 0.2, ease: "power2.in" }, 1.3);
        ft("#badge", { opacity: 1 }, { opacity: 0, duration: 0.12 }, 1.45);

        // 2 · the camera pushes the card to full-bleed; s2-alive.html crossfades the film in on 2.0 s
        ft("#card", { scale: 1, x: 0, y: 0 }, { scale: cardS, x: GEO.fw / 2 - cardCX, y: GEO.fh / 2 - cardCY, duration: 0.7, ease: "power3.inOut" }, 1.5);
        ft("#p1img", { scale: 1, filter: "blur(0px)" }, { scale: 1.06, filter: "blur(4px)", duration: 0.35, ease: "power2.in" }, 1.5);
        ft("#p1img", { scale: 1.06, filter: "blur(4px)" }, { scale: 1.1, filter: "blur(0px)", duration: 0.45, ease: "power2.out" }, 1.85);
        ft("#cardShadow", { opacity: 1 }, { opacity: 0, duration: 0.3 }, 1.5);
        ft("#cardRing", { opacity: 1 }, { opacity: 0, duration: 0.3 }, 1.55);
        ft("#bloom", { x: cardCX, y: cardCY, opacity: 1 }, { x: cardCX, y: cardCY, opacity: 0, duration: 0.5 }, 1.6);
        cut("#cardFloat", { opacity: 1 }, { opacity: 0 }, 2.35);

        // 5 · glow returns behind the price card, then follows it into the logo tile
        ft("#bloom", { x: GEO.price.cx, y: GEO.price.cy, opacity: 0 }, { x: GEO.price.cx, y: GEO.price.cy, opacity: 1, duration: 0.6 }, 17.0);
        ft("#bloom", { x: GEO.price.cx, y: GEO.price.cy }, { x: T.cx, y: T.cy, duration: 0.55, ease: "power3.inOut" }, 21.45);

        // 6 → 1 · the logo tile opens back into the photo card (loop)
        cut("#card", { scale: cardS, x: GEO.fw / 2 - cardCX, y: GEO.fh / 2 - cardCY, clipPath: FULL_WINDOW }, { scale: 1, x: 0, y: 0, clipPath: TILE_WINDOW }, 23.2);
        cut("#p1img", { scale: 1.1 }, { scale: 1 }, 23.2);
        cut("#cardFloat", { opacity: 0 }, { opacity: 1 }, 23.2);
        ft("#card", { clipPath: TILE_WINDOW }, { clipPath: FULL_WINDOW, duration: 0.6, ease: "expo.inOut" }, 23.25);
        ft("#bloom", { x: T.cx, y: T.cy }, { x: cardCX, y: cardCY, duration: 0.6, ease: "expo.inOut" }, 23.25);
        ft("#hookL1 > span", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, 23.45);
        ft(["#cardShadow", "#cardRing", "#badge"], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "sine.inOut" }, 23.55);
        ft("#pager", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 23.55);

        // "AI-generated sample" wherever a slot flagged ai:true in slots.json is on screen
        const MEDIA = window.AOW_MEDIA || {};
        const ON_SCREEN = {
          p1: [[0, 2.35], [23.2, 24]],
          v1: [[1.9, 6]],
          v2: [[6, 8]],
          v3: [[8, 10]],
          v4: [[10, 12]],
          p2: [[12, 16.6]],
          v5: [[12.5, 22]],
        };
        const spans = Object.keys(ON_SCREEN)
          .filter((id) => MEDIA[id] && MEDIA[id].ai)
          .flatMap((id) => ON_SCREEN[id])
          .sort((a, b) => a[0] - b[0])
          .reduce((acc, s) => {
            const last = acc[acc.length - 1];
            if (last && s[0] <= last[1]) last[1] = Math.max(last[1], s[1]);
            else acc.push([s[0], s[1]]);
            return acc;
          }, []);
        for (const [a, b] of spans) {
          if (a <= 0) gsap.set("#aichip", { opacity: 1 });
          else cut("#aichip", { opacity: 0 }, { opacity: 1 }, a);
          if (b < 24) cut("#aichip", { opacity: 1 }, { opacity: 0 }, b);
        }

        window.__timelines["main"] = tl;
      })();
