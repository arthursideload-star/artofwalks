        #s45-root[data-format="landscape"] #s45-scrim {

        #s45-root[data-format="landscape"] #s45-photo {

        #s45-root[data-format="landscape"] #s45-film {

        #s45-root[data-format="landscape"] #s45-handle {

        }
        #s45-root[data-format="landscape"] #s45-copy {
          left: 120px;

        }
        #s45-root[data-format="landscape"] #s45-card {

        }
        #s45-root[data-format="landscape"] #s45-days {

        #s45-root[data-format="landscape"] #s45-cta {

        }
      </style>

      <div id="s45-root" data-composition-id="s45" data-width="1080" data-height="1920" data-duration="10" data-format="portrait">
        <div id="s45-p2wrap" class="vwrap" data-layout-allow-overflow><img id="s45-p2" src="media/p2.jpg" alt="Listing photo" /></div>
        <div id="s45-v5wrap" class="vwrap" data-layout-allow-overflow>
          <video id="s45-v5" src="media/v5.mp4" data-start="0.5" data-duration="9.5" data-hf-media-start-basis="local" data-track-index="1" muted playsinline></video>
        </div>
        <div id="s45-scrim"></div>

        <div id="s45-divider" data-layout-allow-overflow>
          <div id="s45-line"></div>
          <div id="s45-handle">
            <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z" /></svg>
            <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z" /></svg>
          </div>
        </div>
        <div id="s45-photo" class="chip label">Photo</div>
        <div id="s45-film" class="chip label"><span class="dot"></span>Film</div>
        <div id="s45-copy">
          <span id="s45-a" class="ln" data-layout-allow-overflow><span data-layout-allow-occlusion>Your photos,</span></span>
          <span id="s45-b" class="ln" data-layout-allow-overflow><span data-layout-allow-occlusion>made cinematic.</span></span>
        </div>

        <div id="s45-card">
          <div id="s45-sheen" data-layout-allow-overflow></div>
          <div id="s45-inner">
            <div id="s45-from" class="label">From</div>
            <div id="s45-hero" class="price"><span class="cur">€</span><span id="s45-n50">0</span></div>
            <div id="s45-rule"></div>
            <div id="s45-row">
              <span id="s45-full">Full Walkthrough</span>
              <span id="s45-fullprice" class="price"><span class="cur">€</span><span id="s45-n749">0</span></span>
            </div>
            <div id="s45-days">Delivered in days, not weeks.</div>
            <div id="s45-cta">
              artofwalks.com
              <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z" /></svg>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          // scene-local time: 0 here = 12.0 s in the ad
          const root = document.getElementById("s45-root");
          const G = root.dataset.format === "landscape"
            ? { fw: 1920, card: { cx: 960, cy: 540, s: 820 }, tile: { cx: 1330, cy: 430, s: 220 } }
            : { fw: 1080, card: { cx: 540, cy: 900, s: 900 }, tile: { cx: 540, cy: 900, s: 240 } };
          // the logo tile floats on the shared 3 s sine cycle; land where it will be at 22.0 s
          const floatAt = (t) => {
            const k = (t % 3) / 1.5;
            const p = k <= 1 ? k : 2 - k;
            return -8 * (0.5 - 0.5 * Math.cos(Math.PI * p));
          };
          const tl = gsap.timeline({ paused: true });
          const ft = (target, from, to, pos) => tl.fromTo(target, from, Object.assign({ immediateRender: false }, to), pos);
          // first entrance of an element: its hidden from-state applies before the tween starts
          const enter = (target, from, to, pos) => tl.fromTo(target, from, Object.assign({ immediateRender: true }, to), pos);
          const cut = (target, from, to, pos) => ft(target, from, Object.assign({ duration: 0 }, to), pos);

          // ---- 4 · PHOTO | FILM: the divider turns the still into the film (control-target-sync)
          enter("#s45-photo", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 0.1);
          enter("#s45-divider", { x: G.fw + 60, opacity: 1 }, { x: G.fw / 2, opacity: 1, duration: 0.9, ease: "power3.inOut" }, 0.5);
          ft("#s45-v5wrap", { clipPath: "inset(0px 0px 0px 100%)" }, { clipPath: "inset(0px 0px 0px 50%)", duration: 0.9, ease: "power3.inOut" }, 0.5);
          enter("#s45-film", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 1.0);
          enter("#s45-a > span", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.55, ease: "expo.out" }, 1.0);
          enter("#s45-b > span", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, 1.22);
          ft("#s45-handle", { scale: 1 }, { scale: 1.08, duration: 0.5, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.5);
          ft("#s45-divider", { x: G.fw / 2 }, { x: 0, duration: 1.0, ease: "power2.inOut" }, 3.5);
          ft("#s45-v5wrap", { clipPath: "inset(0px 0px 0px 50%)" }, { clipPath: "inset(0px 0px 0px 0%)", duration: 1.0, ease: "power2.inOut" }, 3.5);
          ft("#s45-photo", { opacity: 1 }, { opacity: 0, duration: 0.25 }, 3.6);
          ft("#s45-divider", { opacity: 1 }, { opacity: 0, duration: 0.2 }, 4.35);
          cut("#s45-p2wrap", { opacity: 1 }, { opacity: 0 }, 4.6);
          ft("#s45-copy .ln", { opacity: 1, y: 0 }, { opacity: 0, y: -40, duration: 0.3, ease: "power3.in", stagger: 0.05 }, 4.6);
          ft("#s45-film", { opacity: 1 }, { opacity: 0, duration: 0.25 }, 4.7);

          // ---- 5 · THE OFFER: the film goes soft behind a rising card
          ft("#s45-v5wrap", { filter: "blur(0px) brightness(1)", scale: 1 }, { filter: "blur(26px) brightness(0.42)", scale: 1.1, duration: 0.6, ease: "power2.inOut" }, 4.9);
          ft("#s45-scrim", { opacity: 1 }, { opacity: 0, duration: 0.4 }, 4.9);
          enter("#s45-card", { opacity: 0, y: 70, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.4)" }, 5.1);
          enter("#s45-from", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 5.3);
          enter("#s45-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 6.45);
          enter("#s45-full", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, 6.6);
          enter("#s45-fullprice", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 6.6);
          enter("#s45-days", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 7.6);
          enter("#s45-cta", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 8.1);
          enter("#s45-sheen", { xPercent: -160, rotation: 12 }, { xPercent: 260, rotation: 12, duration: 0.9, ease: "power2.inOut" }, 8.6);
          ft("#s45-inner", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.in" }, 9.3);
          // card-morph-anchor: the card collapses onto the logo tile that s6-logo.html shows at 22.0 s
          const ms = G.tile.s / G.card.s;
          ft(
            "#s45-card",
            { x: 0, y: 0, scaleX: 1, scaleY: 1, backgroundColor: "#141B2D", borderColor: "rgba(232,113,26,0.55)", borderRadius: 32 },
            {
              x: G.tile.cx - G.card.cx,
              y: G.tile.cy - G.card.cy + floatAt(22.0),
              scaleX: ms,
              scaleY: ms,
              backgroundColor: "#0A0A0A",
              borderColor: "rgba(148,163,184,0.26)",
              borderRadius: (G.tile.s * 112) / 512 / ms,
              duration: 0.55,
              ease: "power3.inOut",
            },
            9.45,
          );
          ft("#s45-v5wrap", { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "sine.inOut" }, 9.5);

          // count-ups as a pure function of scene time (counting-dynamic-scale).
          // Prices exactly as on artofwalks.com (index.html, checked 2026-10-17).
          const PRICE_FROM = 50;
          const PRICE_FULL_WALKTHROUGH = 749;
          const n50 = document.getElementById("s45-n50");
          const n749 = document.getElementById("s45-n749");
          const hero = document.getElementById("s45-hero");
          const clamp01 = (v) => Math.min(1, Math.max(0, v));
          const driver = { t: 0 };
          tl.fromTo(
            driver,
            { t: 0 },
            {
              t: 10,
              duration: 10,
              ease: "none",
              immediateRender: false,
              onUpdate() {
                const e50 = 1 - Math.pow(1 - clamp01((driver.t - 5.4) / 1.0), 2);
                n50.textContent = String(Math.round(PRICE_FROM * e50));
                hero.style.transform = `scale(${(0.86 + 0.14 * e50).toFixed(4)})`;
                const e749 = 1 - Math.pow(1 - clamp01((driver.t - 6.6) / 0.8), 3);
                n749.textContent = String(Math.round(PRICE_FULL_WALKTHROUGH * e749));
              },
            },
            0,
          );

          window.__timelines["s45"] = tl;
        })();
      </script>
    </template>
  </body>
