    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const ft = (target, from, to, pos) => tl.fromTo(target, from, Object.assign({ immediateRender: false }, to), pos);
        // first entrance of an element: its hidden from-state applies before the tween starts
        const enter = (target, from, to, pos) => tl.fromTo(target, from, Object.assign({ immediateRender: true }, to), pos);
        const cut = (target, from, to, pos) => ft(target, from, Object.assign({ duration: 0 }, to), pos);

        // frame 0: the hook is already readable; the band is a closed orange seam
        gsap.set("#seam", { scaleX: 0 });
        ft("#glow", { opacity: 0.75 }, { opacity: 1, duration: 2, ease: "sine.inOut", repeat: 8, yoyo: true }, 0);

        // 1 · HOOK (0–2.6): "Don't just show a photo." / "Show them the walkthrough."
        ft("#seam", { scaleX: 0 }, { scaleX: 1, duration: 1.1, ease: "power2.inOut" }, 0.3);
        ft("#hook1 .ln > span", { y: 0, opacity: 1 }, { y: -60, opacity: 0, duration: 0.3, ease: "power3.in", stagger: 0.05 }, 1.55);
        enter("#hook2 .ln > span", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.55, ease: "expo.out", stagger: 0.18 }, 1.85);
        // the shutter opens on the downbeat (2.0 s): the seam splits into the band's edges
        ft("#band", { clipPath: "inset(304px 0px 304px 0px)" }, { clipPath: "inset(0px 0px 0px 0px)", duration: 0.6, ease: "power3.inOut" }, 2.0);
        ft("#seam", { opacity: 1 }, { opacity: 0, duration: 0.2 }, 2.05);
        cut("#aichip", { opacity: 0 }, { opacity: 1 }, 2.0);
        ft("#hook2 .ln > span", { y: 0, opacity: 1 }, { y: -60, opacity: 0, duration: 0.3, ease: "power3.in", stagger: 0.05 }, 2.95);

        // 2 · THE TOUR (2–11.93): one chapter per room, the scrubber follows the film
        enter("#scrub", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.6);
        enter("#scrubLabels", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.7);
        ft("#fill1", { scaleX: 0 }, { scaleX: 1, duration: 4.792, ease: "none" }, 2.0);
        ft("#fill2", { scaleX: 0 }, { scaleX: 1, duration: 5.041, ease: "none" }, 6.792);
        enter("#num1 > span", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.55, ease: "expo.out" }, 3.2);
        enter("#room1 > span", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.55, ease: "expo.out" }, 3.32);
        // chapter 2 lands on the film's own cut (6.79 s)
        ft(["#num1 > span", "#room1 > span"], { yPercent: 0, opacity: 1 }, { yPercent: -110, opacity: 0, duration: 0.3, ease: "power3.in", stagger: 0.04 }, 6.5);
        enter("#num2 > span", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.55, ease: "expo.out" }, 6.79);
        enter("#room2 > span", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.55, ease: "expo.out" }, 6.91);
        ft("#lab1", { color: "#ffffff" }, { color: "#94a3b8", duration: 0.3 }, 6.79);
        ft("#lab2", { color: "#94a3b8" }, { color: "#ffffff", duration: 0.3 }, 6.79);
        ft(["#num2 > span", "#room2 > span"], { yPercent: 0, opacity: 1 }, { yPercent: -110, opacity: 0, duration: 0.3, ease: "power3.in", stagger: 0.04 }, 9.0);
        ft(["#scrub", "#scrubLabels"], { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power3.in" }, 10.7);

        // 3 · THE OFFER (9.3–15): prices around the band while the kitchen plays back
        enter("#from", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 9.3);
        enter("#hero", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 9.4);
        enter("#row", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, 11.0);
        enter("#days", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 13.5);
        enter("#cta", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 14.0);
        ft(["#from", "#hero", "#days", "#row", "#cta"], { opacity: 1, y: 0 }, { opacity: 0, y: -30, duration: 0.3, ease: "power3.in", stagger: 0.04 }, 14.75);

        // 4 · LOGO (15–18): the shutter closes to the seam, the seam becomes the logo
        ft("#band", { clipPath: "inset(0px 0px 0px 0px)" }, { clipPath: "inset(304px 0px 304px 0px)", duration: 0.45, ease: "power3.inOut" }, 14.95);
        ft("#seam", { opacity: 0, scaleX: 1 }, { opacity: 1, scaleX: 1, duration: 0.1 }, 15.3);
        ft("#seam", { scaleX: 1, x: 0 }, { scaleX: 0.222, x: 420, duration: 0.4, ease: "power3.inOut" }, 15.4);
        ft("#seam", { opacity: 1 }, { opacity: 0, duration: 0.15 }, 15.75);
        cut("#aichip", { opacity: 1 }, { opacity: 0 }, 15.4);
        enter("#tilebg", { scale: 0, svgOrigin: "256 256" }, { scale: 1, duration: 0.45, ease: "expo.out" }, 15.7);
        enter("#tri", { scale: 0, rotation: -14, svgOrigin: "256 256" }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(1.8)" }, 15.85);
        enter("#word > span", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.55, ease: "expo.out" }, 16.0);
        enter("#url > span", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 16.2);

        // count-ups as a pure function of time. Prices exactly as on artofwalks.com (index.html, checked 2026-10-23).
        const PRICE_FROM = 50;
        const PRICE_FULL_WALKTHROUGH = 749;
        const n50 = document.getElementById("n50");
        const n749 = document.getElementById("n749");
        const hero = document.getElementById("hero");
        const clamp01 = (v) => Math.min(1, Math.max(0, v));
        const driver = { t: 0 };
        tl.fromTo(
          driver,
          { t: 0 },
          {
            t: 18,
            duration: 18,
            ease: "none",
            immediateRender: false,
            onUpdate() {
              const e50 = 1 - Math.pow(1 - clamp01((driver.t - 9.5) / 1.0), 2);
              n50.textContent = String(Math.round(PRICE_FROM * e50));
              hero.style.transform = `scale(${(0.86 + 0.14 * e50).toFixed(4)})`;
              const e749 = 1 - Math.pow(1 - clamp01((driver.t - 11.0) / 0.8), 3);
              n749.textContent = String(Math.round(PRICE_FULL_WALKTHROUGH * e749));
            },
          },
          0,
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["tourad"] = tl;
      })();
