    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const ft = (target, from, to, pos) => tl.fromTo(target, from, Object.assign({ immediateRender: false }, to), pos);
        // first entrance of an element: its hidden from-state applies before the tween starts
        const enter = (target, from, to, pos) => tl.fromTo(target, from, Object.assign({ immediateRender: true }, to), pos);
        const cut = (target, from, to, pos) => ft(target, from, Object.assign({ duration: 0 }, to), pos);

        // frame 0: the photo card with hook line 1 already on screen
        gsap.set("#hookL2 > span", { yPercent: 110, opacity: 0 });
        gsap.set(["#badgeFilm", "#bar"], { opacity: 0 });
        gsap.set("#fill", { scaleX: 0 });

        // ambient: the card floats on a 3 s sine cycle, the glow breathes on 4 s
        // (the logo floats with it, so the tile and its play mark stay together at the end)
        ft(["#cardFloat", "#logo"], { y: 0 }, { y: -8, duration: 1.5, ease: "sine.inOut", repeat: 9, yoyo: true }, 0);
        ft("#bloom", { opacity: 0.8 }, { opacity: 1, duration: 2, ease: "sine.inOut", repeat: 7, yoyo: true }, 0);

        // 1 · HOOK (0–2.3): the listing photo, then "Now watch."
        ft("#hookL2 > span", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 0.5);
        ft("#pager", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power3.in" }, 1.85);
        // the card leans in as the photo comes alive on the downbeat (2.0 s)
        ft("#cardFloat", { scale: 1 }, { scale: 1.035, duration: 0.5, ease: "power2.out" }, 1.6);
        ft("#cardFloat", { scale: 1.035 }, { scale: 1, duration: 1.2, ease: "sine.inOut" }, 2.1);
        ft("#badgePhoto", { opacity: 1 }, { opacity: 0, duration: 0.2 }, 1.9);
        ft("#badgeFilm", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, 2.0);
        ft("#bar", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 2.0);
        ft("#fill", { scaleX: 0 }, { scaleX: 1, duration: 5, ease: "none" }, 2.0);
        ft("#hook .ln > span", { y: 0, opacity: 1 }, { y: -60, opacity: 0, duration: 0.3, ease: "power3.in", stagger: 0.05 }, 2.35);

        // 2 · THE FILM (2–7): caption, then two objections
        enter("#capL1 > span", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.55, ease: "expo.out" }, 3.0);
        enter("#capL2 > span", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, 3.22);
        ft("#cap .ln > span", { y: 0, opacity: 1 }, { y: -60, opacity: 0, duration: 0.3, ease: "power3.in", stagger: 0.05 }, 6.9);
        enter("#kin1", { opacity: 0, scale: 1.2, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.34, ease: "expo.out" }, 5.5);
        cut("#kin1", { opacity: 1 }, { opacity: 0 }, 6.4);
        enter("#kin2", { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 6.4);
        ft("#kin2", { opacity: 1, y: 0 }, { opacity: 0, y: 30, duration: 0.3, ease: "power3.in" }, 7.25);
        ft(["#bar", "#badgeFilm"], { opacity: 1 }, { opacity: 0, duration: 0.3 }, 7.0);

        // 3 · THE OFFER (7–13.2): prices around the card, which keeps moving
        enter("#from", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 7.5);
        enter("#hero", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 7.6);
        enter("#row", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, 9.2);
        enter("#days", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 11.8);
        enter("#cta", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 12.3);
        ft(["#from", "#hero", "#row", "#days", "#cta"], { opacity: 1, y: 0 }, { opacity: 0, y: -30, duration: 0.3, ease: "power3.in", stagger: 0.04 }, 13.0);

        // 4 · LOGO (13.2–16): the card collapses into the logo tile
        ft("#card img, #card video", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "sine.inOut" }, 13.2);
        ft("#card", { backgroundColor: "#141B2D" }, { backgroundColor: "#0A0A0A", duration: 0.5 }, 13.2);
        ft(
          "#cardFloat",
          { left: 60, top: 660, width: 960, height: 540 },
          { left: 420, top: 740, width: 240, height: 240, duration: 0.6, ease: "power3.inOut" },
          13.25,
        );
        ft(["#card", "#cardRing"], { borderRadius: 32 }, { borderRadius: 52.5, duration: 0.6, ease: "power3.inOut" }, 13.25);
        ft("#card", { clipPath: "inset(0px 0px 0px 0px round 32px)" }, { clipPath: "inset(0px 0px 0px 0px round 52.5px)", duration: 0.6, ease: "power3.inOut" }, 13.25);
        ft("#bloom", { x: 0, y: 0 }, { y: -70, duration: 0.6, ease: "power3.inOut" }, 13.25);
        enter("#tri", { scale: 0, rotation: -14, svgOrigin: "256 256" }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(1.8)" }, 13.85);
        enter("#word > span", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.55, ease: "expo.out" }, 14.0);
        enter("#url > span", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 14.2);
        cut("#aichip", { opacity: 1 }, { opacity: 0 }, 13.3);

        // count-ups as a pure function of time. Prices exactly as on artofwalks.com (index.html, checked 2026-10-23).
        const PRICE_FROM = 50;
        const PRICE_FULL_WALKTHROUGH = 749;
        const n50 = document.getElementById("n50");
        const n749 = document.getElementById("n749");
        const hero = document.getElementById("hero");
        const clamp01 = (v) => Math.min(1, Math.max(0, v));
        const driver = { t: 0 };
        tl.fromTo(
          driver,
          { t: 0 },
          {
            t: 16,
            duration: 16,
            ease: "none",
            immediateRender: false,
            onUpdate() {
              const e50 = 1 - Math.pow(1 - clamp01((driver.t - 7.7) / 1.0), 2);
              n50.textContent = String(Math.round(PRICE_FROM * e50));
              hero.style.transform = `scale(${(0.86 + 0.14 * e50).toFixed(4)})`;
              const e749 = 1 - Math.pow(1 - clamp01((driver.t - 9.2) / 0.8), 3);
              n749.textContent = String(Math.round(PRICE_FULL_WALKTHROUGH * e749));
            },
          },
          0,
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["clipad"] = tl;
      })();
